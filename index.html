<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <!-- 🔥 Viewport penting pisan supados responsive di HP -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buku Induk Hanifa</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- TOPBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow fixed-top">
  <div class="container">

    <a class="navbar-brand fw-bold" href="#">
      📚 Buku Induk HANIFA
    </a>

    <button class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#menuNavbar"
      aria-controls="menuNavbar"
      aria-expanded="false"
      aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="menuNavbar">
      <ul class="navbar-nav ms-auto pt-2 pt-lg-0">

        <li class="nav-item">
          <a class="nav-link active-menu"
             href="javascript:void(0)"
             onclick="tampilHalaman('dashboardPage', this)">
            Dashboard
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link"
             href="javascript:void(0)"
             onclick="tampilHalaman('inputPage', this)">
            Input Data
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link"
             href="javascript:void(0)"
             onclick="tampilHalaman('rekapPage', this)">
            Rekap Data
          </a>
        </li>

      </ul>
    </div>
  </div>
</nav>

<!-- CONTAINER UTAMA (Ditambah pt-5 supados teu katutupan fixed-top navbar) -->
<div class="container pt-5 mt-3 mt-lg-4 mb-5">

  <!-- ================= DASHBOARD ================= -->
  <div id="dashboardPage">

    <h3 class="mb-4 fw-bold">📊 Dashboard</h3>

    <!-- CARD UTAMA -->
    <div class="row g-3">
      <div class="col-12 col-md-4">
        <div class="card p-3 shadow-sm border-0">
          <h5 class="text-muted fs-6">Total Data</h5>
          <h2 id="totalAlumni" class="fw-bold mb-0">0</h2>
        </div>
      </div>
    </div>

    <!-- GRAFIK KOORDINATOR -->
    <h5 class="mt-4 mb-3 fw-bold">📊 Grafik Koordinator</h5>

    <div class="card p-3 shadow-sm border-0">
      <div style="position: relative; width: 100%; min-height: 250px;">
        <canvas id="chartKoordinator"></canvas>
      </div>
    </div>

  </div>

  <!-- ================= INPUT ================= -->
  <div id="inputPage" style="display:none;">

    <h3 class="mb-3 fw-bold">📝 Input Data</h3>

    <div class="card p-3 p-md-4 mb-4 shadow-sm border-0">

      <!-- NAMA -->
      <div class="mb-3">
        <label class="form-label fw-semibold">Nama</label>
        <input type="text" id="nama" class="form-control" placeholder="Eusian nama lengkap">
      </div>

      <!-- ALAMAT -->
      <div class="mb-3">
        <label class="form-label fw-semibold">Alamat</label>
        <textarea id="alamat" class="form-control" rows="3" placeholder="Eusian alamat lengkap"></textarea>
      </div>

      <!-- NO HP -->
      <div class="mb-3">
        <label class="form-label fw-semibold">No HP</label>
        <input type="tel" id="no_hp" class="form-control" placeholder="Contoh: 08123456789">
      </div>

      <!-- KOORDINATOR -->
      <div class="mb-3">
        <label class="form-label fw-semibold">Koordinator</label>
        <select id="koordinator" class="form-select">
          <option value="">-- Pilih Koordinator --</option>
          <option value="Cilemor Pusat">Cilemor Pusat</option>
          <option value="Cilemor Kaler">Cilemor Kaler</option>
          <option value="Pamarican Desakolot">Pamarican Desakolot</option>
          <option value="Cintaharja">Cintaharja</option>
          <option value="Lawong">Lawong</option>
          <option value="Cilongkrang">Cilongkrang</option>
          <option value="Pusakanagara">Pusakanagara</option>
          <option value="Cibeunying Golempang Cisadap">Cibeunying Golempang Cisadap</option>
          <option value="Jelat Karangampel">Jelat Karangampel</option>
          <option value="Karanganyar Ciparigi Sukadana">Karanganyar Ciparigi Sukadana</option>
          <option value="Cipaku Kawali Buniseuri">Cipaku Kawali Buniseuri</option>
          <option value="Bojongrenged Cihideung">Bojongrenged Cihideung</option>
          <option value="Nagreg">Nagreg</option>
          <option value="Garut">Garut</option>
          <option value="Karawang">Karawang</option>
        </select>
      </div>

      <!-- BUTTON -->
      <button onclick="simpanData()" class="btn btn-primary w-100 w-md-auto py-2 fw-bold">
        Simpan
      </button>

    </div>

    <!-- RIWAYAT -->
    <div class="card shadow-sm border-0 p-3 mb-4">
      <h5 class="mb-3 fw-bold">📋 Riwayat Input Terbaru</h5>

      <div class="table-responsive">
        <table class="table table-striped align-middle">
          <thead class="table-primary">
            <tr>
              <th>No</th>
              <th>Nama</th>
              <th>Alamat</th>
              <th>No HP</th>
              <th>Koordinator</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="riwayatBody"></tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- EDIT MODAL / FORM -->
  <div id="editBox" style="display:none;" class="card p-3 p-md-4 shadow-sm border-0 mt-4">

    <h5 class="fw-bold mb-3">Edit Data</h5>

    <input type="hidden" id="edit_row">

    <div class="mb-3">
      <label class="form-label fw-semibold">Nama</label>
      <input type="text" id="edit_nama" class="form-control">
    </div>

    <div class="mb-3">
      <label class="form-label fw-semibold">Alamat</label>
      <textarea id="edit_alamat" class="form-control" rows="3"></textarea>
    </div>

    <div class="mb-3">
      <label class="form-label fw-semibold">No HP</label>
      <input type="tel" id="edit_no_hp" class="form-control">
    </div>

    <div class="mb-3">
      <label class="form-label fw-semibold">Koordinator</label>
      <select id="edit_koordinator" class="form-select">
        <option value="">-- Pilih Koordinator --</option>
        <option value="Cilemor Pusat">Cilemor Pusat</option>
        <option value="Cilemor Kaler">Cilemor Kaler</option>
        <option value="Pamarican Desakolot">Pamarican Desakolot</option>
        <option value="Cintaharja">Cintaharja</option>
        <option value="Lawong">Lawong</option>
        <option value="Cilongkrang">Cilongkrang</option>
        <option value="Pusakanagara">Pusakanagara</option>
        <option value="Cibeunying Golempang Cisadap">Cibeunying Golempang Cisadap</option>
        <option value="Jelat Karangampel">Jelat Karangampel</option>
        <option value="Karanganyar Ciparigi Sukadana">Karanganyar Ciparigi Sukadana</option>
        <option value="Cipaku Kawali Buniseuri">Cipaku Kawali Buniseuri</option>
        <option value="Bojongrenged Cihideung">Bojongrenged Cihideung</option>
        <option value="Nagreg">Nagreg</option>
        <option value="Garut">Garut</option>
        <option value="Karawang">Karawang</option>
      </select>
    </div>

    <button onclick="updateData()" class="btn btn-success w-100 w-md-auto py-2 fw-bold mt-2">
      Update
    </button>

  </div>

  <!-- ================= REKAP ================= -->
  <div id="rekapPage" style="display:none;">

    <h3 class="mb-3 fw-bold">📚 Rekap Data</h3>

    <div class="mb-3">
      <label class="form-label fw-bold">Filter Koordinator</label>
      <select id="filterKoordinator" class="form-select" onchange="filterRekap()">
        <option value="">-- Semua Koordinator --</option>
      </select>
    </div>

    <button onclick="cetakRekap()" class="btn btn-success mb-3 w-100 w-md-auto">
      🖨 Cetak Hasil Filter
    </button>

    <div class="table-responsive">
      <table class="table table-bordered table-striped align-middle">
        <thead class="table-dark">
          <tr>
            <th>No</th>
            <th>Nama</th>
            <th>Alamat</th>
            <th>No HP</th>
            <th>Koordinator</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
        <tfoot class="table-secondary fw-bold">
          <tr>
            <td colspan="4" class="text-end">Total Data</td>
            <td colspan="2" id="totalRekap">0</td>
          </tr>
        </tfoot>
      </table>
    </div>

  </div>

</div>

<!-- LOADING -->
<div id="loading">
  <div class="spinner-border text-light" role="status"></div>
  <p class="mt-3 text-white fw-bold">Loading...</p>
</div>

<!-- SCRIPTS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/navigation.js"></script>

</body>
</html>
