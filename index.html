<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Buku Induk Siswa</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- TOPBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
  <div class="container">

    <a class="navbar-brand fw-bold" href="#">
      📚 Buku Induk
    </a>

    <button class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#menuNavbar">

      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="menuNavbar">

      <ul class="navbar-nav ms-auto">

        <li class="nav-item">
          <a class="nav-link active-menu"
             href="javascript:void(0)"
             onclick="tampilHalaman('dashboardPage', this)">
            Dashboard
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link"
             href="javascript:void(0)"
             onclick="tampilHalaman('inputPage', this)">
            Input Data
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link"
             href="javascript:void(0)"
             onclick="tampilHalaman('rekapPage', this)">
            Rekap Data
          </a>
        </li>

      </ul>

    </div>
  </div>
</nav>

<!-- CONTAINER UTAMA -->
<div class="container mt-4">

<!-- ================= DASHBOARD ================= -->
<div id="dashboardPage">

  <h3 class="mb-4 fw-bold">📊 Dashboard</h3>

  <!-- CARD UTAMA -->
  <div class="row">

    <div class="col-md-4 mb-3">
      <div class="card p-3 shadow">
        <h5>Total Data</h5>
        <h2 id="totalSiswa">0</h2>
      </div>
    </div>

  </div>

  <!-- 🔥 REKAP KOORDINATOR -->
  <h5 class="mt-4 mb-3">📍 Rekap Koordinator</h5>

  <div class="row" id="koordinatorRekap">
    <!-- otomatis diisi dari JS -->
  </div>

</div>

<!-- ================= INPUT ================= -->
<div id="inputPage" style="display:none;">

  <h3 class="mb-3 fw-bold">📝 Input Data</h3>

  <div class="card p-3 mb-4 shadow border-0">

    <!-- NAMA -->
    <div class="mb-3">
      <label>Nama</label>
      <input type="text" id="nama" class="form-control">
    </div>

    <!-- ALAMAT -->
    <div class="mb-3">
      <label>Alamat</label>
      <textarea id="alamat" class="form-control"></textarea>
    </div>

    <!-- NO HP -->
    <div class="mb-3">
      <label>No HP</label>
      <input type="text" id="no_hp" class="form-control">
    </div>

    <!-- KOORDINATOR -->
    <div class="mb-3">
      <label>Koordinator</label>

      <select id="koordinator" class="form-control">
        <option value="">-- Pilih Koordinator --</option>
        <option value="Cilemor Pusat">Cilemor Pusat</option>
        <option value="Cilemor Kaler">Cilemor Kaler</option>
        <option value="Pamarican Desakolot">Pamarican Desakolot</option>
        <option value="Cintaharja">Cintaharja</option>
        <option value="Lawong">Lawong</option>
        <option value="Cilongkrang">Cilongkrang</option>
        <option value="Pusakanagara">Pusakanagara</option>
        <option value="Cibeunying Golempang Cisadap">Cibeunying Golempang Cisadap</option>
        <option value="Jelat Karangampel">Jelat Karangampel</option>
        <option value="Karanganyar Ciparigi Sukadana">Karanganyar Ciparigi Sukadana</option>
        <option value="Cipaku Kawali Buniseuri">Cipaku Kawali Buniseuri</option>
        <option value="Bojongrenged Cihideung">Bojongrenged Cihideung</option>
        <option value="Nagreg">Nagreg</option>
        <option value="Garut">Garut</option>
        <option value="Karawang">Karawang</option>
      </select>

    </div>

    <!-- BUTTON -->
    <button onclick="simpanData()" class="btn btn-primary">
      Simpan
    </button>

  </div>

  <!-- RIWAYAT -->
  <div class="card shadow border-0 p-3 mb-5">

    <h5 class="mb-3">📋 Riwayat Input Terbaru</h5>

    <div class="table-responsive">
      <table class="table table-striped">

        <thead class="table-primary">
          <tr>
            <th>No</th>
            <th>Nama</th>
            <th>Alamat</th>
            <th>No HP</th>
            <th>Koordinator</th>
            <th>Aksi</th>
          </tr>
        </thead>

        <tbody id="riwayatBody"></tbody>

      </table>
    </div>

  </div>

</div>

<!-- EDIT MODAL / FORM -->
<div id="editBox" style="display:none;" class="card p-3 shadow mt-4">

  <h5>Edit Data</h5>

  <input type="hidden" id="edit_row">

  <div class="mb-2">
    <label>Nama</label>
    <input type="text" id="edit_nama" class="form-control">
  </div>

  <div class="mb-2">
    <label>Alamat</label>
    <textarea id="edit_alamat" class="form-control"></textarea>
  </div>

  <div class="mb-2">
    <label>No HP</label>
    <input type="text" id="edit_no_hp" class="form-control">
  </div>

  <div class="mb-2">
    <label>Koordinator</label>

    <select id="edit_koordinator" class="form-control">
      <option value="">-- Pilih Koordinator --</option>
      <option value="Cilemor Pusat">Cilemor Pusat</option>
      <option value="Cilemor Kaler">Cilemor Kaler</option>
      <option value="Pamarican Desakolot">Pamarican Desakolot</option>
      <option value="Cintaharja">Cintaharja</option>
      <option value="Lawong">Lawong</option>
      <option value="Cilongkrang">Cilongkrang</option>
      <option value="Pusakanagara">Pusakanagara</option>
      <option value="Cibeunying Golempang Cisadap">Cibeunying Golempang Cisadap</option>
      <option value="Jelat Karangampel">Jelat Karangampel</option>
      <option value="Karanganyar Ciparigi Sukadana">Karanganyar Ciparigi Sukadana</option>
      <option value="Cipaku Kawali Buniseuri">Cipaku Kawali Buniseuri</option>
      <option value="Bojongrenged Cihideung">Bojongrenged Cihideung</option>
      <option value="Nagreg">Nagreg</option>
      <option value="Garut">Garut</option>
      <option value="Karawang">Karawang</option>
    </select>

  </div>

  <button onclick="updateData()" class="btn btn-success mt-2">
    Update
  </button>

</div>

<!-- ================= REKAP ================= -->
<div id="rekapPage" style="display:none;">

  <h3 class="mb-3 fw-bold">📚 Rekap Data</h3>

  <div class="mb-3">
    <label class="fw-bold">Filter Koordinator</label>

    <select id="filterKoordinator" class="form-control" onchange="filterRekap()">
      <option value="">-- Semua Koordinator --</option>
    </select>
  </div>

  <div class="table-responsive">
    <table class="table table-bordered table-striped">

      <thead class="table-dark">
        <tr>
          <th>No</th>
          <th>Nama</th>
          <th>Alamat</th>
          <th>No HP</th>
          <th>Koordinator</th>
          <th>Aksi</th>
        </tr>
      </thead>

      <tbody id="tbody"></tbody>

      <!-- 🔥 TFOOT JUMLAH -->
      <tfoot class="table-secondary fw-bold">
        <tr>
          <td colspan="4" class="text-end">Total Data</td>
          <td colspan="4" id="totalRekap">0</td>
        </tr>
      </tfoot>

    </table>
  </div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/navigation.js"></script>

<!-- LOADING (SUDAH DIHAPUS DUPLIKATNYA, TINGGAL 1 SAJA) -->
<div id="loading">
  <div class="spinner-border text-light" role="status"></div>
  <p class="mt-3 text-white fw-bold">Loading...</p>
</div>

</body>
</html>
